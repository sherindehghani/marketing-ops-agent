x-agent-image: &agent-image
  image: marketing-ops-agent:local
  build: .

services:
  seed:
    <<: *agent-image
    entrypoint: ["python", "seed_db.py"]
    command: ["--db", "/data/marketing.db", "--if-missing"]
    volumes:
      - marketing-data:/data

  api:
    <<: *agent-image
    depends_on:
      seed:
        condition: service_completed_successfully
    entrypoint: ["python", "-m", "uvicorn"]
    command: ["api:app", "--host", "0.0.0.0", "--port", "8000"]
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment: &planner-env
      API_CONCURRENCY: ${API_CONCURRENCY:-8}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
    volumes:
      - marketing-data:/data:ro

  gateway:
    image: docker.arvancloud.ir/library/nginx:1.28-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  agent:
    <<: *agent-image
    profiles: ["cli"]
    environment: *planner-env
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - marketing-data:/data:ro

volumes:
  marketing-data:
